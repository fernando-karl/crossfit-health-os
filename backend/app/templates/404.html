{% extends "base.html" %}

{% block title %}404 - {{ t("errors.page_404_title") }}{% endblock %}

{% block content %}
<div class="chos-error-page">
    <div class="text-center" style="max-width: 28rem;">
        <div class="chos-error-page__mark mb-4" aria-hidden="true"></div>
        <p class="chos-error-page__code mb-3">404</p>
        <h1 class="h3 fw-bold mb-3">{{ t("errors.page_404_title") }}</h1>
        <p class="text-secondary mb-4">{{ t("errors.page_404_body") }}</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="/" class="chos-btn chos-btn-primary chos-btn-lg">
                <i class="fas fa-home me-2"></i>{{ t("errors.back_home") }}
            </a>
            <a href="/dashboard" class="chos-btn chos-btn-outline chos-btn-lg">
                <i class="fas fa-house me-2"></i>{{ t("errors.to_dashboard") }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
