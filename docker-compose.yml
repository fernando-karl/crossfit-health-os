version: '3.8'

services:
  # FastAPI Backend (local dev — run `alembic upgrade head` after first boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossfit-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/crossfit
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-12345678}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - INTERNAL_CRON_SECRET=${INTERNAL_CRON_SECRET:-dev-cron-secret}
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:8000
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - crossfit-network

  redis:
    image: redis:7-alpine
    container_name: crossfit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crossfit-network
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: crossfit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crossfit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - crossfit-network

networks:
  crossfit-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
